# playbooks.yml — 조치용 플레이북 등록부. 실행 allowlist의 단일 정본이다.
#
# 여기 등록된 이름만 ansible-ops workflow가 dispatch를 허용한다 — 강사 제공
# 조치와 에이전트 추가 조치 구분 없이 전부 이 등록부를 탄다(2026-08-07, 구
# "빌트인 7종은 workflow BUILTIN 목록" 규칙 대체). "파일만 있으면 실행"이
# 아니라 "등록된 것만 실행"이다.
#
# allowlist는 환경 정본 브랜치의 이 파일이다: dev 실행=dev 등록분, prod 실행=
# main 등록분. 이 파일·플레이북 본체는 dev CODEOWNERS 무소유라 dev 코드 PR로
# auto-merge되고, main(=prod 실행 허용)에는 dev→main 승격 PR(사람 승인)로만
# 도달한다 — 승인이 곧 prod 실행 허용이다.
#
# 파라미터: 값을 받는 플레이북은 ansible/specs/<name>.yml 스펙이 키·타입·범위를
# 선언하고, ansible-ops의 generic 검증 엔진이 스펙 통과 값만 -e @extra-vars.json
# 으로 전달한다. specs/는 dev 브랜치에서도 사람 소유(CODEOWNERS) — 파라미터
# 조치의 입력 계약은 dev 진입부터 사람이 승인한다. 스펙 없는 플레이북 = 파라미터
# 불허(값이 오면 거부).
#
# 규칙:
#   - name 은 ansible/<name>.yml 파일명과 정확히 일치(확장자 제외).
#   - name 문자셋: ^[a-z][a-z0-9-]{2,48}$ (경로 조작 방지 — ${name}.yml 로 실행됨).
#   - hosts 는 env_<env> 로 한정되고 serial:1 롤링을 권장(무중단).
#   - 장애 주입용 플레이북은 등록하지 않는다 — 조치용만.

playbooks:
  - name: disk-grow
    desc: "볼륨 확대(tfvars) 뒤 파일시스템 확장 (디스크 임계 조치)"
  - name: security-patch
    desc: "serial 롤링 보안 패치 (+필요 시 재부팅, +추가 패키지 설정)"
  - name: monitoring-agents
    desc: "node_exporter + promtail (재)설치 — 교체된 fleet의 scrape down(up==0 no-data) 조치"
  - name: rds-temp-user
    desc: "만료(VALID UNTIL) 있는 임시 RDS role 생성/삭제 — bastion 경유, DROP은 state=absent"
  - name: rds-readonly-user
    desc: "dev 상시 readonly RDS 계정 생성(멱등) — 강의 자료 데모 값"
  - name: rolling-restart
    desc: "ALB TG 드레인 → 앱 재시작 → /healthz 확인 → TG 복귀 (serial 1)"
  - name: instance-resize
    desc: "인스턴스 타입 롤링 변경(무중단) — 완료 후 같은 값으로 ec2_instance_type tfvars PR 머지 필수"
