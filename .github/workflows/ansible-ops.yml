name: ansible-ops
# run-name에 playbook@env를 노출한다 — run 목록 가독성 + 플러그인이 같은 작업의
# in-flight run을 식별해 중복 dispatch를 재사용(dedup)하는 키로 쓴다.
run-name: "ansible-ops: ${{ inputs.playbook || 'auto-disk-grow' }} @ ${{ inputs.environment || 'push' }}${{ inputs.dry_run == 'true' && ' (dry-run)' || '' }}"

# ansible 조치를 self-hosted 러너(label: ansible, 2-0-setup/1-foundation/runner.tf)에서 실행한다.
# 러너는 VPC 안에 있어 app 서버에 SSH로 붙는다(<project> 키). --limit env_<env>로
# 대상 환경(dev/prod)을 좁힌다. 리포 루트 ansible/의 플레이북을 돌린다.
#   - disk-grow        : 2-04. EBS 라이브 확대 뒤 파일시스템 확장. env disk.auto.tfvars 머지 시
#                        자동(사람 머지=push 트리거, 봇 auto-merge=auto-merge.yml이 dispatch) + 수동.
#   - security-patch   : 2-08. serial 롤링 보안 패치(+패키지 surface). 수동.
#   - monitoring-agents: node_exporter + promtail 설치. 2-3 실습 사전 준비(초기 세팅 아님).
#                        수동 + 에이전트 dispatch — 인스턴스 교체(blue-green) 후 up==0
#                        no-data 조치를 에이전트가 dispatch한다.
#   - rds-temp-user    : 2-03. 만료 임시 RDS 유저 생성/DROP(bastion 경유). 수동.
#   - rds-readonly-user: dev 상시 readonly 계정 생성(멱등, bastion 경유). dev 전용 —
#                        prod는 상시 계정 금지(rds-temp-user만). dev 세팅 apply 후
#                        에이전트가 dispatch한다(구 bastion user_data 부트스트랩 대체).
#   - rolling-restart  : TG 드레인 → 재시작 → healthz → 복귀 (serial 1). 수동 + 에이전트 dispatch.
#   - instance-resize  : 인스턴스 타입 롤링 변경(TG 드레인 → stop/modify/start → healthy,
#                        serial 1). terraform 경로는 두 대 동시 stop(순단)이라 이 경로 사용.
#                        실행 후 ec2_instance_type tfvars 동기화 PR 필수. 수동 + 에이전트 dispatch.
#
# 초기 서비스 세팅에 ansible은 dev readonly 계정(rds-readonly-user) 하나만 쓴다 —
# 앱 기동과 /data 마운트는 EC2 user_data가 부팅에서 완결한다(modules/service/app.tf).
# 나머지 플레이북은 운영 중 조치·실습용이다.
on:
  push:
    # 브랜치=환경 매핑: dev disk surface는 dev 브랜치에 머지된다(사람 머지 push).
    # 봇 auto-merge는 push 이벤트가 억제돼 auto-merge.yml이 dispatch로 대신 돈다.
    branches: [main, dev]
    paths:
      - "2-1-dev/disk.auto.tfvars"
      - "2-2-prod/disk.auto.tfvars"
  workflow_dispatch:
    inputs:
      environment:
        description: "대상 환경"
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      playbook:
        # string(choice 아님) — 실행 allowlist는 환경 정본 브랜치의 등록부
        # (ansible/playbooks.yml)라서 이름 목록이 이 파일에 고정되지 않는다
        # (choice는 등록 시점에 목록 고정 → 신규 이름이 422로 거부됨). 아래
        # '플레이북 허용·파라미터 검증' step이 등록부 + specs/ 스펙으로 판정한다
        # (엔진은 사람 소유 .github/에 있어 에이전트가 못 우회).
        description: "실행할 플레이북(ansible/playbooks.yml 등록 이름)"
        type: string
        required: true
        default: disk-grow
      params:
        # 플레이북별 파라미터(JSON object 문자열). 허용 키·타입·범위는
        # ansible/specs/<name>.yml 스펙(사람 소유 — dev CODEOWNERS도 소유)이
        # 선언하고, 검증 엔진이 스펙 통과 값만 -e @extra-vars.json 으로 전달한다.
        # 스펙 없는 플레이북은 빈 값만 허용. 예: instance-resize →
        # {"instance_type":"t3.small"}
        description: "파라미터 JSON object (ansible/specs/<name>.yml 스펙 검증 통과 값만)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "true면 --check (아무것도 바꾸지 않고 무엇이 일어날지만 확인)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read # checkout용 — 이 워크플로는 리포에 아무것도 쓰지 않는다
  actions: read # disk-grow의 tf-apply 완료 대기(run 목록 조회)용

jobs:
  ansible:
    runs-on: [self-hosted, ansible]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      PROJECT: ${{ vars.PROJECT_NAME || github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5

      - name: 대상 환경/플레이북 결정
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            PB="${{ github.event.inputs.playbook }}"
          else
            # push: 브랜치=환경. dev 브랜치=dev, main 브랜치=prod. 트리거 paths가
            # disk.auto.tfvars 변경을 이미 보장하므로 main push는 항상 prod growpart를
            # 돌린다(prod 볼륨 미변경이면 growpart는 멱등 no-op). 과거엔 git diff로
            # 어느 env disk가 바뀌었는지 판별했으나, shallow checkout(fetch-depth=1)에서
            # github.event.before 커밋이 로컬에 없어 diff가 실패하면 `|| true`가 이를
            # 삼켜 ENV=dev로 오폴백 → main(prod) 디스크 상향이 dev 호스트에 잘못 적용됐다.
            if [ "${{ github.ref_name }}" = "dev" ]; then
              ENV=dev
            else
              ENV=prod
            fi
            PB=disk-grow
          fi
          # 환경 한정(예: rds-readonly-user dev 전용)은 스펙의 envs 필드가 선언하고
          # 아래 검증 엔진이 강제한다 — 이름별 하드코딩 없음.
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "pb=$PB" >> "$GITHUB_OUTPUT"
          echo "환경=$ENV 플레이북=$PB"

      - name: 플레이북 허용·파라미터 검증 (등록부 + 스펙 엔진)
        id: spec
        env:
          PB: ${{ steps.pick.outputs.pb }}
          ENVIRONMENT: ${{ steps.pick.outputs.env }}
          PARAMS_JSON: ${{ github.event.inputs.params }}
        run: |
          set -euo pipefail
          # 이름 문자셋 봉쇄 — 아래에서 ansible/${PB}.yml 로 실행되므로 경로 조작을 막는다.
          echo "$PB" | grep -Eq '^[a-z][a-z0-9-]{2,48}$' \
            || { echo "잘못된 플레이북 이름: '$PB'" >&2; exit 1; }
          # 실행 allowlist는 환경 정본 브랜치의 등록부(ansible/playbooks.yml)다 —
          # 강사 제공·에이전트 추가 구분 없이 전부(2026-08-07 통합, 구 BUILTIN 목록
          # 대체). dev 실행=dev 등록분, prod 실행=main 등록분(dev→main 승격 PR 사람
          # 승인 = prod 실행 허용). 체크아웃 ref가 환경 정본과 다르면 다른 브랜치의
          # 등록부·플레이북으로 도는 우회이므로 거부한다.
          CANON=$([ "$ENVIRONMENT" = "dev" ] && echo dev || echo main)
          if [ "${GITHUB_REF_NAME}" != "$CANON" ]; then
            echo "플레이북 '$PB'($ENVIRONMENT)는 정본 브랜치 $CANON에서만 실행 — 현재 ref=${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          test -f ansible/playbooks.yml \
            || { echo "ansible/playbooks.yml 등록부 없음" >&2; exit 1; }
          # 등록부에 '- name: <PB>' 라인이 있어야 한다(등록됨). 이름은 위에서 문자셋
          # 검증했으므로 정규식 보간에 안전하다.
          grep -Eq "^[[:space:]]*-[[:space:]]*name:[[:space:]]*[\"']?${PB}[\"']?[[:space:]]*$" ansible/playbooks.yml \
            || { echo "'$PB'는 ansible/playbooks.yml에 등록되지 않음 — 코드 PR로 파일과 등록을 함께 추가(prod는 dev→main 승격 승인 필요)" >&2; exit 1; }
          test -f "ansible/${PB}.yml" \
            || { echo "ansible/${PB}.yml 파일 없음 — 코드 PR로 파일과 등록을 함께 추가" >&2; exit 1; }
          # 파라미터 검증 — generic 엔진. 스펙(ansible/specs/<PB>.yml, dev 브랜치에서도
          # 사람 소유)이 선언한 키·타입·범위만 통과시키고, 통과 값을 JSON 파일로 남겨
          # 실행 step이 -e @extra-vars.json 으로 소비한다(셸 문자열 보간 없음).
          # 스펙 없음 = 파라미터 불허. 이름별 분기 없음 — 스펙이 곧 검증 규칙이다.
          python3 - <<'PY'
          import json, os, re, sys

          import yaml  # ansible 의존성이라 러너에 항상 있다

          def die(msg):
              print(msg, file=sys.stderr)
              sys.exit(1)

          pb = os.environ["PB"]
          env = os.environ["ENVIRONMENT"]
          raw = os.environ.get("PARAMS_JSON") or ""
          try:
              params = json.loads(raw) if raw.strip() else {}
          except ValueError:
              die("params가 JSON이 아님")
          if not isinstance(params, dict):
              die("params는 JSON object여야 한다")

          spec = {}
          spec_path = f"ansible/specs/{pb}.yml"
          if os.path.exists(spec_path):
              with open(spec_path) as f:
                  spec = yaml.safe_load(f) or {}

          envs = spec.get("envs") or ["dev", "prod"]
          if env not in envs:
              die(f"'{pb}'는 {envs} 전용 — {env} 불허(스펙 envs)")

          decls = {}
          for p in spec.get("params") or []:
              name = str((p or {}).get("name") or "") if isinstance(p, dict) else ""
              if not re.fullmatch(r"[a-z][a-z0-9_]{0,40}", name):
                  die(f"스펙 params 항목 형식 오류: {p!r}")
              decls[name] = p

          for k, v in params.items():
              d = decls.get(k)
              if d is None:
                  die(f"파라미터 '{k}'는 '{pb}' 스펙에 없음 — 허용: {', '.join(decls) or '(없음)'}")
              t = d.get("type") or "string"
              if t == "choice":
                  if v not in (d.get("choices") or []):
                      die(f"'{k}'는 {d.get('choices')} 중 하나여야 함 (받음: {v!r})")
              elif t == "int":
                  if not isinstance(v, int) or isinstance(v, bool):
                      die(f"'{k}'는 int여야 함 (받음: {v!r})")
                  lo, hi = d.get("min"), d.get("max")
                  if (lo is not None and v < lo) or (hi is not None and v > hi):
                      die(f"'{k}'는 {lo}..{hi} 범위여야 함 (받음: {v})")
              else:
                  if not isinstance(v, str):
                      die(f"'{k}'는 문자열이어야 함 (받음: {v!r})")
                  pat = d.get("pattern")
                  if pat and not re.fullmatch(pat, v):
                      die(f"'{k}'는 패턴 {pat} 불일치")

          missing = [k for k, d in decls.items() if d.get("required") and k not in params]
          if missing:
              die(f"필수 파라미터 누락: {', '.join(missing)}")

          # derived: 러너에서만 알 수 있는 값 — 실행 step의 provider(case 분기)가
          # 조회해 주입한다. 엔진이 모르는 이름은 여기서 거부.
          known_derived = {"db_host", "db_admin_password"}
          derived = spec.get("derived") or []
          bad = [d for d in derived if d not in known_derived]
          if bad:
              die(f"엔진이 지원하지 않는 derived {bad} — 지원: {sorted(known_derived)}")

          tmp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(tmp, "params.json"), "w") as f:
              json.dump(params, f)
          with open(os.path.join(tmp, "secret-params.txt"), "w") as f:
              f.write("\n".join(k for k, d in decls.items() if d.get("secret") and k in params))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"derived={' '.join(derived)}\n")
              out.write(f"has_params={'true' if params else 'false'}\n")
          print(f"플레이북 '{pb}' ({env}) — 등록·스펙 검증 통과 (파라미터 {len(params)}개, derived {len(derived)}개)")
          PY
          # secret 파라미터(스펙 secret: true) 값은 run 로그에서 마스킹한다.
          while IFS= read -r k; do
            if [ -n "$k" ]; then
              v=$(jq -r --arg k "$k" '.[$k] // empty' "$RUNNER_TEMP/params.json")
              if [ -n "$v" ]; then echo "::add-mask::$v"; fi
            fi
          done < "$RUNNER_TEMP/secret-params.txt"

      - name: tf-apply 완료 대기 (disk-grow — EBS 확대 → growpart 순서 보장)
        if: steps.pick.outputs.pb == 'disk-grow'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 같은 머지에서 tf-apply(EBS modify)와 이 워크플로가 함께 뜬다. growpart가
          # 볼륨 확대 완료 전에 돌면 no-op이 되므로 tf-apply가 끝날 때까지 기다린다.
          # head_sha 필터로 이 머지 커밋의 run만 센다 — 무관한 tf-apply(반대 env,
          # 3-1-pagerduty 등)까지 기다리지 않는다. 사람 머지(push)와 봇 경로(auto-merge가
          # 같은 ref tip에서 두 워크플로를 연달아 dispatch) 모두 head_sha가 일치한다.
          # (러너에 gh가 없어 curl+jq 사용. queued/in_progress 0이 될 때까지 폴링.)
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tf-apply.yml/runs"
          sleep 30 # dispatch 직후 run 레코드 생성 지연 대비
          for i in $(seq 1 60); do
            active=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "${api}?per_page=30&head_sha=${GITHUB_SHA}" \
              | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
            if [ "${active}" -eq 0 ]; then
              echo "tf-apply 완료(또는 없음) — growpart 진행"
              break
            fi
            echo "tf-apply ${active}건 진행 중 — 대기 (${i}/60)"
            sleep 20
          done
          # 20분 초과 시에도 진행한다 — growpart는 멱등이라 볼륨이 아직 안 컸으면 no-op,
          # 이후 수동 재실행(workflow_dispatch)으로 회수 가능.

      - name: ansible-playbook 실행 (env 한정)
        working-directory: ansible
        env:
          ENVIRONMENT: ${{ steps.pick.outputs.env }}
          PLAYBOOK: ${{ steps.pick.outputs.pb }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DERIVED: ${{ steps.spec.outputs.derived }}
          HAS_PARAMS: ${{ steps.spec.outputs.has_params }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_PASSWORD != '' && secrets.DB_PASSWORD || 'AppDemoPw2026!' }}
        run: |
          set -euo pipefail
          # aws_ec2 동적 인벤토리에 필요한 컬렉션 갱신. self-hosted 러너라 이미 설치돼
          # 있는 게 보통 — 네트워크 실패 등은 기존 버전으로 진행한다(|| true).
          ansible-galaxy collection install amazon.aws --upgrade >/dev/null 2>&1 || true
          # dry_run=true면 --check로 아무것도 바꾸지 않는다. push 트리거(자동 disk-grow)는
          # dry_run input이 없어 빈 값 → 실제 실행.
          CHECK=""
          [ "${DRY_RUN:-}" = "true" ] && CHECK="--check"
          # extra-vars 조립 — 이름별 분기 없음. 검증 step이 남긴 스펙 통과 파라미터에,
          # 스펙이 요청한 derived 값(러너에서만 알 수 있는 값)을 provider가 조회해
          # 합친다. 전달은 -e @파일 하나 — 셸 문자열 보간이 없어 주입 경로가 없다.
          FINAL="$RUNNER_TEMP/extra-vars.json"
          if [ "${HAS_PARAMS:-false}" = "true" ]; then
            cp "$RUNNER_TEMP/params.json" "$FINAL"
          else
            echo '{}' > "$FINAL"
          fi
          for d in ${DERIVED:-}; do
            case "$d" in
              db_host)
                V=$(aws rds describe-db-instances \
                  --db-instance-identifier "${PROJECT}-${ENVIRONMENT}" \
                  --query 'DBInstances[0].Endpoint.Address' --output text --region "$AWS_REGION") ;;
              db_admin_password)
                V="$DB_ADMIN_PASSWORD" ;;
              *)
                echo "지원하지 않는 derived '$d' — 검증 step과 provider 목록 불일치" >&2; exit 1 ;;
            esac
            jq --arg k "$d" --arg v "$V" '. + {($k): $v}' "$FINAL" > "$FINAL.tmp" && mv "$FINAL.tmp" "$FINAL"
          done
          EXTRA_OPT=""
          [ "$(jq 'length' "$FINAL")" -gt 0 ] && EXTRA_OPT="-e @$FINAL"
          ansible-playbook "${PLAYBOOK}.yml" -l "env_${ENVIRONMENT}" $CHECK $EXTRA_OPT
