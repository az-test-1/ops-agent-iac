name: tf-destroy

# 과정 최종 철거 전용 — 평시 서비스 내리기는 service_enabled=false surface PR(2-09 경로)로.
# 그 경로도 apply 전에 같은 destroy-approval 승인을 거친다(tf-apply.yml approve-destroy 잡).
# destroy 후 git의 service_enabled 값은 수동 정리 전제.
#
# 수동 실행: 디렉터리 하나를 terraform destroy. 리소스 삭제는 무조건 승인 + 인프라팀 멘션.
#   1) notify 잡이 Slack에 인프라팀(@진)을 멘션해 삭제 승인 요청을 알린다.
#   2) destroy 잡은 GitHub Environment(destroy-approval)로 게이트된다 — 이 environment에
#      required reviewers를 설정해두면 사람이 승인해야 destroy가 실행된다.
# INFRA_SLACK_MENTION(기본 @진)은 수강생이 자기 Slack 멘션(<@U...>)으로 서치·수정한다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "destroy할 디렉터리"
        type: choice
        required: true
        default: 2-1-dev
        options:
          - 2-1-dev
          - 2-2-prod
          - 3-1-pagerduty

# id-token: write -> OIDC로 apply 롤 assume. contents: read -> checkout.
permissions:
  id-token: write
  contents: read

jobs:
  notify:
    name: 삭제 승인 요청 (Slack 멘션)
    runs-on: ubuntu-latest
    steps:
      - name: Slack에 인프라팀 멘션 (webhook 있으면)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MENTION: ${{ vars.INFRA_SLACK_MENTION || '@진' }}
          TARGET: ${{ github.event.inputs.target }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — Slack 멘션 스킵(승인 게이트는 environment가 담당)."
            exit 0
          fi
          text="${MENTION} :warning: *리소스 삭제 승인 요청* — \`${TARGET}\` destroy를 ${ACTOR} 가 요청했습니다. 승인: ${RUN_URL}"
          jq -nc --arg t "$text" '{text:$t}' | \
            curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
          echo "Slack 멘션 전송됨."

  destroy:
    name: destroy (${{ github.event.inputs.target }})
    needs: notify
    runs-on: ubuntu-latest
    # 이 environment에 required reviewers를 걸면 사람 승인 전까지 이 잡이 대기한다.
    environment: destroy-approval
    # 의도적으로 tf-apply와 같은 group — 같은 디렉터리(=같은 state)에 apply와
    # destroy가 동시에 붙지 않게 직렬화한다.
    concurrency:
      group: tf-${{ github.event.inputs.target }}-apply
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      PROJECT: ${{ vars.PROJECT_NAME || github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 이 잡은 push하지 않는다 — 자격증명을 워킹트리에 남길 이유가 없다.
          persist-credentials: false

      - name: session name 정리
        id: sess
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: echo "name=tf-destroy-$(printf '%s' "$TARGET" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: AWS 자격증명 구성 (apply role, OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ steps.sess.outputs.name }}

      - name: terraform destroy
        uses: dflook/terraform-destroy@v2
        with:
          path: ${{ github.event.inputs.target }}
          backend_config: |
            bucket=${{ env.PROJECT }}-state-${{ secrets.AWS_ACCOUNT_ID }}
            key=states/${{ github.event.inputs.target }}.tfstate
            region=${{ env.AWS_REGION }}
            use_lockfile=true
          variables: |
            project = "${{ env.PROJECT }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || '0000000000000000000000000000000000000000' }}
          # tf-plan/tf-apply와 동일한 fallback — secret 미설정 시 빈 문자열이 default를
          # 덮어 destroy plan이 어긋나는 것을 막는다.
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD != '' && secrets.DB_PASSWORD || 'AppDemoPw2026!' }}
          # 3-1-pagerduty destroy 전용 — provider 검증 때문에 더미 불가(tf-plan 참조).
          PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
          TF_VAR_oncall_user_email: ${{ vars.PD_ONCALL_EMAIL }}
